services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DB_NAME: birdalytics
      DB_USER: postgres
      DB_PASSWORD: student
      DB_HOST: db
      DB_PORT: 5432
      # commenting out
      # JWT_SECRET: ${JWT_SECRET}
      # JWT_EXPIRE: ${JWT_EXPIRE:-7d}
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./ai-model-test
      dockerfile: Dockerfile.prod
