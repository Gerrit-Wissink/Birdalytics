services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DB_NAME: birdalytics
      DB_USER: postgres
      DB_PASSWORD: student
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"