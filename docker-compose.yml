services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: student
      POSTGRES_DB: birdalytics
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DB_NAME: birdalytics
      DB_USER: postgres
      DB_PASSWORD: student
      DB_HOST: db
      DB_PORT: 5432
      NODE_ENV: development
    ports:
      - "8000:8000"

  worker:
    build: ./ai-model-test
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:student@db:5432/birdalytics

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
